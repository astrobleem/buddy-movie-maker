name: Windows x64 player
on:
  pull_request:
    paths:
      - 'tools/BuddyMoviePlayer/**'
      - '.github/workflows/player-windows.yml'
  push:
    branches: [main, codex/windows-x64-wzg1]
    paths:
      - 'tools/BuddyMoviePlayer/**'
      - '.github/workflows/player-windows.yml'
permissions:
  contents: read
jobs:
  player:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained x64 player
        shell: pwsh
        run: |
          dotnet publish tools/BuddyMoviePlayer -c Release -r win-x64 --self-contained true -o out
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
      - name: Test formats and deterministic synthesis without an audio device
        shell: pwsh
        run: |
          $player = Join-Path $PWD 'out/BuddyMoviePlayer.exe'
          $evidence = Join-Path $PWD 'test-output'
          $test = Start-Process $player -ArgumentList @('--self-test-headless', $evidence) -Wait -PassThru
          Get-Content (Join-Path $evidence 'test-results.txt')
          if ($test.ExitCode -ne 0) { throw 'Player tests failed' }
      - name: Verify frozen PIT contract without an audio device
        shell: pwsh
        run: |
          $player = Join-Path $PWD 'out/BuddyMoviePlayer.exe'
          $corpus = Join-Path $PWD 'tools/BuddyMoviePlayer/Tests/PitContract/v1'
          $evidence = Join-Path $PWD 'pit-test-output'
          $test = Start-Process $player -ArgumentList @('--pit-contract-test-headless', $corpus, $evidence) -Wait -PassThru
          Get-Content (Join-Path $evidence 'pit-results.txt')
          if ($test.ExitCode -ne 0) { throw 'PIT contract tests failed' }
      - name: Verify frozen WZG1 gain contract without an audio device
        shell: pwsh
        run: |
          $player = Join-Path $PWD 'out/BuddyMoviePlayer.exe'
          $corpus = Join-Path $PWD 'tools/BuddyMoviePlayer/Tests/GainContract/v1'
          $evidence = Join-Path $PWD 'gain-test-output'
          $test = Start-Process $player -ArgumentList @('--gain-contract-test-headless', $corpus, $evidence) -Wait -PassThru
          Get-Content (Join-Path $evidence 'gain-results.txt')
          if ($test.ExitCode -ne 0) { throw 'Gain contract tests failed' }
