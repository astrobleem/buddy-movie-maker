name: Maker MML3 compiler and contract
on:
  pull_request:
    paths:
      - 'tools/BuddyMovieMaker/**'
      - '.gitattributes'
      - '.github/workflows/maker-mml3.yml'
  push:
    branches: [main]
    paths:
      - 'tools/BuddyMovieMaker/**'
      - '.gitattributes'
      - '.github/workflows/maker-mml3.yml'
permissions:
  contents: read
jobs:
  compiler-contract:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.425'
      - name: Compile self-contained Windows Maker
        shell: pwsh
        run: |
          dotnet publish tools/BuddyMovieMaker/App -c Release -r win-x64 --self-contained true -o out
          if ($LASTEXITCODE -ne 0) { throw 'Maker compile failed' }
      - name: Check frozen contract and production compiler
        shell: pwsh
        run: |
          ./tools/BuddyMovieMaker/Tests/CheckMml3Compiler.ps1 -Assembly "$PWD/out/BuddyMovieMaker.dll" -Output "$PWD/compiler-results.json"
      # DOS qualification requires an independently licensed external toolchain.
      # No runtime capability marker, binaries or CI artifacts are published here.
